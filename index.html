<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Inventario Taller</title>

<!-- html5-qrcode con fallback de CDN si uno está bloqueado -->
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'"></script>

<style>
  :root {
    --bg: #f5f5f4; --surface: #ffffff; --surface-2: #fafaf9;
    --border: #e7e5e4; --border-strong: #d6d3d1;
    --text: #1c1917; --text-muted: #78716c;
    --primary: #1e3a8a; --primary-fg: #ffffff;
    --accent: #ca8a04;
    --success: #16a34a; --warning: #eab308; --danger: #dc2626;
    --green-bg: #d9ead3; --yellow-bg: #fff2cc; --red-bg: #f4cccc;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    --radius: 10px; --radius-sm: 6px; --tap: 48px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 720px; margin: 0 auto; background: var(--surface); }

  header.top {
    background: var(--primary); color: var(--primary-fg);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow-sm);
  }
  header.top h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
  .conn-badge {
    font-size: 11px; padding: 5px 12px; border-radius: 999px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer;
    border: none; color: white; min-height: 28px;
  }
  .conn-badge.online { background: rgba(22,163,74,0.9); }
  .conn-badge.offline { background: rgba(220,38,38,0.9); }
  .conn-badge.pending { background: rgba(234,179,8,0.95); color: #1c1917; }

  nav.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav.tabs button {
    flex: 1; background: none; border: none; border-bottom: 3px solid transparent;
    padding: 14px 8px; font-size: 14px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; transition: all 0.15s; min-height: var(--tap);
  }
  nav.tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }

  main.view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .view-panel { display: none; }
  .view-panel.active { display: block; }

  .scanner-wrap { padding: 16px; }
  #qrReader {
    width: 100%; min-height: 280px; background: #000;
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-md);
    position: relative;
  }
  #qrReader video { border-radius: var(--radius); }
  #qrReader__dashboard_section_csr { padding: 8px !important; }
  #qrReader__scan_region { background: #000 !important; }
  /* ocultamos textos verbosos de la librería */
  #qrReader__header_message, #qrReader__dashboard_section_swaplink { display: none !important; }

  .scan-status {
    margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm);
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 14px; color: var(--text-muted); text-align: center; min-height: 40px;
  }
  .scan-controls { display: flex; gap: 8px; margin-top: 12px; }
  .scan-controls button { flex: 1; }
  .manual-entry {
    margin-top: 16px; padding: 14px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .manual-entry label {
    display: block; font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
  }
  .manual-entry .row { display: flex; gap: 8px; }
  .manual-entry input { flex: 1; }

  input[type="text"], input[type="number"], input[type="search"] {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); font-size: 16px; background: var(--surface);
    color: var(--text); min-height: var(--tap); font-family: inherit;
  }
  input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

  button {
    font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text); cursor: pointer;
    min-height: var(--tap); transition: transform 0.05s, background 0.1s;
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  button.success { background: var(--success); color: white; border-color: var(--success); }
  button.danger  { background: var(--danger);  color: white; border-color: var(--danger);  }
  button.warn    { background: var(--accent); color: white; border-color: var(--accent); }
  button.ghost   { background: transparent; }
  button[disabled] { opacity: 0.5; cursor: not-allowed; }

  .list-controls {
    position: sticky; top: 0; z-index: 5; background: var(--surface);
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }

  /* === BUSCADOR CON SUGERENCIAS === */
  .search-row { position: relative; }
  .search-row input { padding-left: 40px; }
  .search-row::before {
    content: "🔍"; position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); font-size: 14px; opacity: 0.5; pointer-events: none;
  }
  .suggestions {
    position: absolute; top: 100%; left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
    max-height: 280px; overflow-y: auto; z-index: 20;
    margin-top: 4px; display: none;
  }
  .suggestions.visible { display: block; }
  .sug-item {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    cursor: pointer; min-height: var(--tap);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .sug-item:last-child { border-bottom: none; }
  .sug-item:active, .sug-item:hover { background: var(--surface-2); }
  .sug-item .sug-name { font-weight: 600; font-size: 14px; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sug-item .sug-name mark { background: #fef08a; color: var(--text); padding: 0 2px; border-radius: 2px; font-weight: 700; }
  .sug-item .sug-stock {
    font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700;
    padding: 3px 8px; border-radius: 4px; flex-shrink: 0;
  }
  .sug-item .sug-stock.NORMAL  { background: var(--green-bg);  color: #166534; }
  .sug-item .sug-stock.BAJO    { background: var(--yellow-bg); color: #854d0e; }
  .sug-item .sug-stock.CRITICO { background: var(--red-bg);    color: #991b1b; }

  .mode-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; font-size: 13px;
  }
  .toggle-group {
    display: flex; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 2px;
  }
  .toggle-group button {
    padding: 6px 12px; min-height: 32px; font-size: 12px; font-weight: 600;
    border: none; background: transparent; border-radius: 4px; color: var(--text-muted);
  }
  .toggle-group button.active { background: var(--primary); color: white; }
  .meta-info { color: var(--text-muted); font-size: 12px; }

  ul.product-list { list-style: none; margin: 0; padding: 0; }
  ul.product-list li {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border); min-height: 60px;
  }
  ul.product-list li.estado-CRITICO { background: var(--red-bg); }
  ul.product-list li.estado-BAJO    { background: var(--yellow-bg); }
  ul.product-list li.estado-NORMAL  { background: var(--surface); }
  .product-info { flex: 1; min-width: 0; }
  .product-name {
    font-weight: 600; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .product-name mark { background: #fef08a; color: var(--text); padding: 0 2px; border-radius: 2px; font-weight: 700; }
  .product-qty { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-family: ui-monospace, monospace; }
  .product-qty .qty-num { font-weight: 700; color: var(--text); font-size: 13px; }
  .qty-actions { display: flex; gap: 6px; }
  .qty-actions button {
    width: 44px; height: 44px; padding: 0; font-size: 22px; font-weight: 700;
    line-height: 1; border-radius: 50%; border: 1px solid var(--border-strong);
    background: var(--surface); user-select: none; -webkit-user-select: none;
  }
  .qty-actions .btn-minus { color: var(--danger); border-color: #f5b5b5; }
  .qty-actions .btn-plus  { color: var(--success); border-color: #b5dcb8; }
  .qty-actions .btn-add { width: auto; padding: 0 14px; font-size: 13px; border-radius: var(--radius-sm); }

  .empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }

  .cart-fab {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--primary); color: white; padding: 12px 20px;
    border-radius: 999px; box-shadow: var(--shadow-lg);
    font-weight: 600; font-size: 14px; cursor: pointer; border: none; z-index: 50;
    min-height: var(--tap); display: flex; align-items: center; gap: 8px;
  }
  .cart-fab .count-badge {
    background: var(--accent); color: var(--text); border-radius: 999px;
    padding: 2px 8px; font-size: 12px; font-weight: 700;
  }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: flex-end; justify-content: center; z-index: 100;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal {
    background: var(--surface); width: 100%; max-width: 720px; max-height: 90vh;
    border-radius: 16px 16px 0 0; overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .modal-header {
    padding: 18px 20px 8px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface);
  }
  .modal-header h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .modal-header .sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .modal-body { padding: 20px; }
  .modal-footer {
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; border-top: 1px solid var(--border);
    background: var(--surface); position: sticky; bottom: 0;
  }
  .modal-footer button { flex: 1; }
  .type-toggle {
    display: flex; gap: 0; border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 16px;
  }
  .type-toggle button {
    flex: 1; border: none; border-radius: 0;
    background: var(--surface); color: var(--text-muted); font-weight: 600;
  }
  .type-toggle button.active.entrada { background: var(--success); color: white; }
  .type-toggle button.active.salida  { background: var(--danger);  color: white; }
  .qty-stepper { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .qty-stepper button {
    width: 56px; height: 56px; padding: 0; font-size: 28px; font-weight: 700; border-radius: 12px;
  }
  .qty-stepper input {
    flex: 1; text-align: center; font-size: 28px; font-weight: 700; height: 56px;
    font-family: ui-monospace, monospace;
  }
  .info-block {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 16px; font-size: 14px;
  }
  .info-block .row { display: flex; justify-content: space-between; padding: 3px 0; }
  .info-block .row .label { color: var(--text-muted); }
  .info-block .row .val { font-weight: 600; }

  .cart-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .cart-item:last-child { border-bottom: none; }
  .cart-item .info { flex: 1; min-width: 0; }
  .cart-item .name { font-weight: 600; font-size: 14px; }
  .cart-item .small { font-size: 12px; color: var(--text-muted); }
  .cart-item .type-pill {
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; border: none;
  }
  .cart-item .type-pill.entrada { background: var(--success); color: white; }
  .cart-item .type-pill.salida  { background: var(--danger);  color: white; }
  .cart-item .qty-input { width: 56px; text-align: center; padding: 6px; font-weight: 700; font-size: 14px; }
  .cart-item .delete {
    background: transparent; border: none; color: var(--text-muted);
    font-size: 18px; width: 32px; height: 32px; padding: 0; min-height: 32px;
  }

  .toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
    z-index: 200; box-shadow: var(--shadow-md); animation: fadeIn 0.2s;
    max-width: 90%; text-align: center;
  }
  .toast.success { background: var(--success); color: white; }
  .toast.error   { background: var(--danger);  color: white; }
  .toast.info    { background: var(--text); color: white; }
  .toast.warn    { background: var(--accent); color: white; }

  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
    border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .queue-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .queue-item:last-child { border-bottom: none; }
  .queue-item .info { flex: 1; min-width: 0; }
  .queue-item .ts { font-size: 11px; color: var(--text-muted); }
  .queue-item .delta {
    font-family: ui-monospace, monospace; font-weight: 700; font-size: 13px;
    padding: 4px 8px; border-radius: 4px;
  }
  .queue-item .delta.entrada { background: var(--green-bg); color: #166534; }
  .queue-item .delta.salida  { background: var(--red-bg);   color: #991b1b; }

  .snapshot-banner {
    background: var(--yellow-bg); color: #713f12;
    padding: 8px 16px; font-size: 12px; text-align: center;
    border-bottom: 1px solid #f0d97a;
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <h1>Inventario · Taller</h1>
    <button id="connBadge" class="conn-badge online" type="button">●</button>
  </header>

  <nav class="tabs">
    <button id="tabScanner" class="active" data-tab="scanner">📷 Escáner</button>
    <button id="tabList" data-tab="list">📋 Lista</button>
  </nav>

  <main class="view">
    <section id="panelScanner" class="view-panel active">
      <div class="scanner-wrap">
        <div id="qrReader"></div>
        <div class="scan-status" id="scanStatus">Toca "Activar cámara" para empezar</div>
        <div class="scan-controls">
          <button id="btnStartScan" class="primary">Activar cámara</button>
          <button id="btnStopScan" class="ghost" style="display:none;">Detener</button>
        </div>
        <div class="manual-entry">
          <label for="manualCode">Entrada manual de código</label>
          <div class="row">
            <input id="manualCode" type="text" inputmode="numeric" placeholder="Ej: 40050599">
            <button id="btnManualLookup" class="primary">Buscar</button>
          </div>
        </div>
      </div>
    </section>

    <section id="panelList" class="view-panel">
      <div id="snapshotBanner" class="snapshot-banner" style="display:none;"></div>
      <div class="list-controls">
        <div class="search-row">
          <input id="searchInput" type="text" placeholder="Buscar por nombre..." autocomplete="off" autocorrect="off" autocapitalize="off">
          <div class="suggestions" id="suggestions"></div>
        </div>
        <div class="mode-row">
          <div class="toggle-group" id="modeToggle">
            <button data-mode="directo" class="active">Directo</button>
            <button data-mode="carrito">Carrito</button>
          </div>
          <span class="meta-info" id="listMeta">— productos</span>
        </div>
      </div>
      <ul class="product-list" id="productList"></ul>
    </section>
  </main>

  <button id="cartFab" class="cart-fab" style="display:none;">
    🛒 Ver carrito
    <span class="count-badge" id="cartCount">0</span>
  </button>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============ CONFIG ============ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbySbapI4sGFrqb_5hzQZILx1djU8H8txgmdF0IZJHZ8zZci7xicpFORYdcYzfZre1y5/exec";
const CART_KEY = "inventario_carrito_v1";
const SNAPSHOT_KEY = "inventario_snapshot_v1";
const QUEUE_KEY = "inventario_queue_v1";
const LONG_PRESS_MS = 500;
const FETCH_TIMEOUT_MS = 12000;
const MAX_SUGGESTIONS = 8;

/* ============ STATE ============ */
const state = {
  inventario: [],
  filtro: "",
  modoLista: "directo",
  carrito: loadJSON(CART_KEY, []),
  queue: loadJSON(QUEUE_KEY, []),
  snapshotTs: null,
  scanner: null,
  scanning: false,
  ultimoEscaneo: { codigo: null, ts: 0 }
};

/* ============ STORAGE ============ */
function loadJSON(key, def) {
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : def; }
  catch { return def; }
}
function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
function saveCart() { saveJSON(CART_KEY, state.carrito); }
function saveQueue() { saveJSON(QUEUE_KEY, state.queue); }
function saveSnapshot() {
  const snap = { ts: Date.now(), items: state.inventario };
  saveJSON(SNAPSHOT_KEY, snap); state.snapshotTs = snap.ts;
}
function loadSnapshot() {
  const s = loadJSON(SNAPSHOT_KEY, null);
  if (s) state.snapshotTs = s.ts;
  return s;
}

/* ============ API ============ */
async function api(action, params = {}) {
  const url = new URL(GAS_URL);
  url.searchParams.set("action", action);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  url.searchParams.set("_t", Date.now());
  const ctl = new AbortController();
  const tid = setTimeout(() => ctl.abort(), FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(url.toString(), { method: "GET", redirect: "follow", signal: ctl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally { clearTimeout(tid); }
}

/* ============ TOASTS ============ */
function toast(msg, kind = "info", ms = 2200) {
  const root = document.getElementById("toastRoot");
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* ============ TABS ============ */
document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => switchTab(btn.dataset.tab));
});
function switchTab(tab) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel" + cap(tab)).classList.add("active");
  if (tab === "list") { refreshList(); updateCartFab(); }
  else { document.getElementById("cartFab").style.display = "none"; }
  if (tab !== "scanner" && state.scanning) stopScanner();
}
function cap(s) { return s[0].toUpperCase() + s.slice(1); }

/* ============ ESCÁNER (html5-qrcode) ============ */
const btnStart = document.getElementById("btnStartScan");
const btnStop = document.getElementById("btnStopScan");
const scanStatus = document.getElementById("scanStatus");

btnStart.addEventListener("click", startScanner);
btnStop.addEventListener("click", stopScanner);

// Espera hasta que la librería termine de cargar (max 5s)
async function waitForHtml5Qrcode(maxMs = 5000) {
  const start = Date.now();
  while (typeof Html5Qrcode === "undefined") {
    if (Date.now() - start > maxMs) return false;
    await new Promise(r => setTimeout(r, 100));
  }
  return true;
}

async function startScanner() {
  scanStatus.textContent = "Cargando librería...";
  const ok = await waitForHtml5Qrcode();
  if (!ok) {
    toast("Librería no cargada. Verifica conexión y recarga.", "error", 3500);
    scanStatus.textContent = "Error de carga";
    return;
  }

  // Limpiar scanner previo si quedó en estado raro
  if (state.scanner) {
    try { await state.scanner.stop(); state.scanner.clear(); } catch {}
    state.scanner = null;
  }

  try {
    scanStatus.textContent = "Iniciando cámara...";

    // Configuración optimizada para códigos industriales Code 128:
    // - fps alto (15) porque solo decodificamos un formato → ciclo más rápido
    // - qrbox más ancho y bajo (códigos 1D son horizontales)
    const config = {
      fps: 15,
      qrbox: function(viewW, viewH) {
        // Caja 80% del ancho, alto reducido (ratio ~3.5:1, óptimo para Code 128)
        const w = Math.floor(viewW * 0.80);
        const h = Math.floor(w * 0.30);
        return { width: w, height: Math.min(h, viewH * 0.5) };
      },
      aspectRatio: 1.333
    };

    // Solo Code 128 (estándar industrial O-I) → decodificación mucho más rápida
    if (typeof Html5QrcodeSupportedFormats !== "undefined") {
      config.formatsToSupport = [
        Html5QrcodeSupportedFormats.CODE_128
      ];
    }

    state.scanner = new Html5Qrcode("qrReader", { verbose: false });

    await state.scanner.start(
      { facingMode: "environment" },     // cámara trasera
      config,
      (decodedText) => handleScanResult(decodedText),
      () => {} // ignorar errores de frame (son normales)
    );

    state.scanning = true;
    btnStart.style.display = "none";
    btnStop.style.display = "";
    scanStatus.textContent = "Apunta al código de barras";
  } catch (e) {
    console.error("Scanner error:", e);
    scanStatus.textContent = "Error: " + (e.message || e);
    toast("No se pudo abrir la cámara. Asegura permisos.", "error", 3500);
    // Limpiar estado si falló
    if (state.scanner) {
      try { state.scanner.clear(); } catch {}
      state.scanner = null;
    }
    state.scanning = false;
    btnStart.style.display = "";
    btnStop.style.display = "none";
  }
}

async function stopScanner() {
  if (state.scanner) {
    try { await state.scanner.stop(); state.scanner.clear(); } catch {}
    state.scanner = null;
  }
  state.scanning = false;
  btnStart.style.display = "";
  btnStop.style.display = "none";
  scanStatus.textContent = "Cámara apagada";
}

function handleScanResult(codigo) {
  const now = Date.now();
  if (state.ultimoEscaneo.codigo === codigo && now - state.ultimoEscaneo.ts < 2500) return;
  state.ultimoEscaneo = { codigo, ts: now };
  scanStatus.textContent = "Detectado: " + codigo;
  if (navigator.vibrate) navigator.vibrate(80);

  // Pausar el escáner mientras se procesa el modal
  // (evita escaneos dobles del mismo o adyacentes mientras el usuario decide)
  pauseScanner();

  lookupAndOpenMovementModal(codigo);
}

function pauseScanner() {
  if (state.scanner && state.scanning) {
    try {
      state.scanner.pause(true); // true = freeze frame visible
      scanStatus.textContent = "⏸ Escáner pausado · procesando código";
    } catch (e) { console.warn("pause scanner:", e); }
  }
}

function resumeScanner() {
  if (state.scanner && state.scanning) {
    try {
      state.scanner.resume();
      scanStatus.textContent = "Apunta al código de barras";
    } catch (e) { console.warn("resume scanner:", e); }
  }
}

/* ============ LOOKUP ============ */
async function lookupAndOpenMovementModal(codigo) {
  if (!navigator.onLine) return lookupOffline(codigo);
  try {
    const r = await api("lookup", { codigo });
    if (r.ok) openMovementModal(r.item, codigo);
    else if (r.notFound) openNotFoundModal(codigo);
    else toast(r.error || "Error", "error");
  } catch (e) {
    setOnline(false);
    lookupOffline(codigo);
  }
}
function lookupOffline(codigo) {
  const snap = loadSnapshot();
  if (!snap) { toast("Sin conexión y sin datos cacheados", "error", 3000); return; }
  const item = snap.items.find(it => String(it.codigo).trim() === String(codigo).trim());
  if (item) { toast("📦 Modo offline · datos cacheados", "warn", 1500); openMovementModal(item, codigo); }
  else openNotFoundModal(codigo);
}

/* ============ MODAL: MOVIMIENTO ============ */

        ${item.ubicacion ? `<div class="row"><span class="label">Ubicación</span><span class="val">${esc(item.ubicacion)}</span></div>` : ""}
      </div>
      <div class="type-toggle" id="typeToggle">
        <button class="active salida" data-tipo="salida">↓ Salida</button>

      </div>

      <div class="qty-stepper">

        <button data-step="+1">+</button>

    </div>
    <div class="modal-footer">
      <button class="ghost" data-close>Cancelar</button>
      <button class="primary" id="btnConfirmMove">Confirmar</button>
    </div>`;
  const modal = openModal(tpl);
  let tipo = "salida";
  modal.querySelectorAll("#typeToggle button").forEach(b => {
    b.addEventListener("click", () => {
      tipo = b.dataset.tipo;
      modal.querySelectorAll("#typeToggle button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    });
  });
  const qtyInput = modal.querySelector("#qtyInput");
  modal.querySelectorAll("[data-step]").forEach(b => {
    b.addEventListener("click", () => {

      qtyInput.value = Math.max(1, cur + Number(b.dataset.step));
    });
  });
  modal.querySelector("#btnConfirmMove").addEventListener("click", async () => {
    const cantidad = Number(qtyInput.value);
    if (!cantidad || cantidad <= 0) { toast("Cantidad inválida", "error"); return; }
    const btn = modal.querySelector("#btnConfirmMove");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ...';
    const result = await tryMove(codigo, tipo, cantidad, item);
    if (result.success) {
      const txt = result.queued
        ? `📥 En cola · Stock: ${result.stockEstimado}`
        : `✓ ${tipo === "entrada" ? "+" : "−"}${cantidad} · Stock: ${result.stockNuevo}`;
      toast(txt, result.queued ? "warn" : "success", 1800);
      if (navigator.vibrate) navigator.vibrate([60,40,60]);
      closeModal();
    } else {

      btn.disabled = false;
      btn.textContent = "Confirmar";

function openNotFoundModal(codigo) {
  const tpl = `
    <div class="modal-header">
      <h2>Código no registrado</h2>

    <div class="modal-body">

      </p>

      toast("📥 En cola (sin conexión)", "warn"); closeModal();

/* ============ MOVE CON QUEUE ============ */
async function tryMove(codigo, tipo, cantidad, itemRef) {
  if (itemRef && tipo === "salida" && itemRef.cantidad - cantidad < 0) {
    return { success: false, error: `Stock insuficiente. Disponible: ${itemRef.cantidad}` };
  }
  if (!navigator.onLine) return queueMoveAndOptimistic(codigo, tipo, cantidad, itemRef);
  try {
    const r = await api("move", { codigo, tipo, cantidad });
    if (r.ok) {
      if (itemRef) { itemRef.cantidad = r.stockNuevo; saveSnapshot(); }
      return { success: true, stockNuevo: r.stockNuevo };
    }
    if (r.stockInsuficiente) return { success: false, error: `Stock insuficiente. Disponible: ${r.stockAnterior}` };
    if (r.notFound) return { success: false, error: "Código no encontrado" };
    return { success: false, error: r.error || "Error" };
  } catch (e) {
    setOnline(false);
    return queueMoveAndOptimistic(codigo, tipo, cantidad, itemRef);
  }
}

function queueMoveAndOptimistic(codigo, tipo, cantidad, itemRef) {
  enqueue("move", { codigo, tipo, cantidad });
  let stockEstimado = null;
  if (itemRef) {
    itemRef.cantidad += (tipo === "entrada" ? cantidad : -cantidad);
    stockEstimado = itemRef.cantidad;
    saveSnapshot();
    renderList();
  }
  return { success: true, queued: true, stockEstimado };
}

/* ============ QUEUE ============ */
function enqueue(action, params) {
  state.queue.push({
    id: Date.now() + "_" + Math.random().toString(36).slice(2,7),
    action, params, ts: Date.now()
  });
  saveQueue(); updateConnBadge();
}
function dequeue(id) {
  state.queue = state.queue.filter(q => q.id !== id);
  saveQueue(); updateConnBadge();
}
async function flushQueue() {
  if (state.queue.length === 0) return { exitos: 0, fallos: 0, detalleFallos: [] };
  if (!navigator.onLine) return { exitos: 0, fallos: 0, offline: true, detalleFallos: [] };
  let exitos = 0, fallos = 0;
  const detalleFallos = [];
  const copia = [...state.queue];
  for (const op of copia) {
    try {
      const r = await api(op.action, op.params);
      if (r.ok) { dequeue(op.id); exitos++; }
      else {
        // Error de negocio: registramos motivo y lo sacamos de la cola
        dequeue(op.id);
        fallos++;
        detalleFallos.push({
          op,
          motivo: r.stockInsuficiente
            ? `Stock insuficiente (disponible: ${r.stockAnterior})`
            : (r.notFound ? "Código no encontrado" : (r.error || "Error desconocido"))
        });
      }
    } catch { break; }  // red caída: dejamos el resto en cola para reintentar
  }
  return { exitos, fallos, detalleFallos };
}

/* ============ ONLINE / OFFLINE ============ */
function setOnline(ok) {
  if (ok && state.queue.length > 0) autoSync();
  updateConnBadge();
}
function updateConnBadge() {
  const b = document.getElementById("connBadge");
  if (!navigator.onLine) {
    b.className = "conn-badge offline";
    b.textContent = "● OFFLINE" + (state.queue.length ? ` (${state.queue.length})` : "");
  } else if (state.queue.length > 0) {
    b.className = "conn-badge pending";
    b.textContent = `● PENDIENTES (${state.queue.length})`;
  } else {
    b.className = "conn-badge online";
    b.textContent = "● ONLINE";
  }
}
let _syncing = false;
async function autoSync() {
  if (_syncing) return;
  _syncing = true;
  try {
    const r = await flushQueue();
    if (r.exitos > 0) toast(`✓ Sincronizadas ${r.exitos}`, "success");
    if (r.fallos > 0) {
      // Mostrar detalle del primer fallo (los demás quedan en consola)
      const primerFallo = r.detalleFallos[0];
      const codigo = primerFallo.op.params.codigo;
      toast(`⚠ ${r.fallos} fallaron. ${codigo}: ${primerFallo.motivo}`, "error", 5000);
      console.warn("Detalle de operaciones fallidas:", r.detalleFallos);
    }
    if ((r.exitos > 0 || r.fallos > 0) && document.getElementById("panelList").classList.contains("active"))
      refreshList();
  } finally { _syncing = false; updateConnBadge(); }
}
window.addEventListener("online", () => { setOnline(true); toast("Conexión recuperada", "success", 1500); });
window.addEventListener("offline", () => { setOnline(false); toast("Sin conexión - modo offline", "warn", 2000); });
document.getElementById("connBadge").addEventListener("click", openQueueModal);

function openQueueModal() {
  let bodyHtml;
  if (state.queue.length === 0) {
    bodyHtml = '<div class="empty">No hay operaciones pendientes</div>';
  } else {
    bodyHtml = state.queue.map(op => {
      const p = op.params;
      const isMove = op.action === "move";
      const delta = isMove ? `${p.tipo === "entrada" ? "+" : "−"}${p.cantidad}` : "—";
      const klass = isMove ? p.tipo : "";
      return `
        <div class="queue-item">
          <div class="info">
            <div class="mono">${esc(p.codigo)}</div>
            <div class="ts">${new Date(op.ts).toLocaleString()} · ${op.action}</div>
          </div>
          <span class="delta ${klass}">${delta}</span>
        </div>`;
    }).join("");
  }
  const tpl = `
    <div class="modal-header">
      <h2>Cola offline (${state.queue.length})</h2>
      <div class="sub">${navigator.onLine ? "Online · listas para sincronizar" : "Sin conexión · esperando red"}</div>
    </div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-footer">
      <button class="ghost" data-close>Cerrar</button>
      <button class="primary" id="btnSync" ${(!navigator.onLine || state.queue.length === 0) ? "disabled" : ""}>Sincronizar ahora</button>
    </div>`;
  const modal = openModal(tpl);
  const btn = modal.querySelector("#btnSync");
  if (btn) btn.addEventListener("click", async () => {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ...';
    await autoSync(); closeModal();
  });
}

/* ============ LISTA + BUSCADOR CON SUGERENCIAS ============ */
const productListEl = document.getElementById("productList");
const searchInput = document.getElementById("searchInput");
const suggestionsEl = document.getElementById("suggestions");
const listMeta = document.getElementById("listMeta");
const snapshotBanner = document.getElementById("snapshotBanner");

// Listener con debounce ligero (50ms) para no renderizar 3 veces por tecla
let _searchDebounce = null;
function onSearchChange() {
  if (_searchDebounce) clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(() => {
    state.filtro = searchInput.value.toLowerCase().trim();
    renderSuggestions();
    renderList();
  }, 50);
}
// Solo "input" es necesario en navegadores modernos. Mantenemos "change" como red de seguridad.
searchInput.addEventListener("input", onSearchChange);
searchInput.addEventListener("change", onSearchChange);
searchInput.addEventListener("focus", renderSuggestions);
searchInput.addEventListener("blur", () => {
  // delay para permitir tap en sugerencia
  setTimeout(() => suggestionsEl.classList.remove("visible"), 200);
});

document.querySelectorAll("#modeToggle button").forEach(b => {
  b.addEventListener("click", () => {
    state.modoLista = b.dataset.mode;
    document.querySelectorAll("#modeToggle button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    renderList(); updateCartFab();
  });
});

function renderSuggestions() {
  if (!state.filtro) { suggestionsEl.classList.remove("visible"); return; }
  const matches = state.inventario
    .filter(it => String(it.producto || "").toLowerCase().includes(state.filtro))
    .slice(0, MAX_SUGGESTIONS);
  if (matches.length === 0) { suggestionsEl.classList.remove("visible"); return; }

  suggestionsEl.innerHTML = matches.map(it => {
    const ec = estadoOf(it);
    return `
      <div class="sug-item" data-codigo="${esc(it.codigo)}" data-nombre="${esc(it.producto)}">
        <span class="sug-name">${highlight(it.producto, state.filtro)}</span>
        <span class="sug-stock ${ec}">${it.cantidad} ${esc(it.unidad || "")}</span>
      </div>`;
  }).join("");

  suggestionsEl.querySelectorAll(".sug-item").forEach(el => {
    el.addEventListener("mousedown", e => e.preventDefault()); // evita blur antes del click
    el.addEventListener("click", () => {
      const nombre = el.dataset.nombre;
      searchInput.value = nombre;
      state.filtro = nombre.toLowerCase();
      suggestionsEl.classList.remove("visible");
      renderList();
      // scroll al item
      const li = productListEl.querySelector(`li[data-codigo="${CSS.escape(el.dataset.codigo)}"]`);
      if (li) li.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });
  suggestionsEl.classList.add("visible");
}

function highlight(text, query) {
  const t = String(text || "");
  if (!query) return esc(t);
  const idx = t.toLowerCase().indexOf(query);
  if (idx < 0) return esc(t);
  return esc(t.slice(0, idx)) + "<mark>" + esc(t.slice(idx, idx + query.length)) + "</mark>" + esc(t.slice(idx + query.length));
}

async function refreshList() {
  if (!navigator.onLine) { loadFromSnapshotIntoUI(true); return; }
  productListEl.innerHTML = '<li class="empty">Cargando...</li>';
  try {
    const r = await api("list");
    if (r.ok) {
      state.inventario = r.items;
      saveSnapshot();
      snapshotBanner.style.display = "none";
      renderList(); setOnline(true);
    } else {
      productListEl.innerHTML = `<li class="empty">Error: ${esc(r.error)}</li>`;
    }
  } catch (e) {
    setOnline(false);
    loadFromSnapshotIntoUI(true);
  }
}

function loadFromSnapshotIntoUI(showBanner) {
  const snap = loadSnapshot();
  if (!snap) {
    productListEl.innerHTML = `<li class="empty">Sin conexión y sin datos guardados.<br>Conéctate al menos una vez para cargar el inventario.</li>`;
    snapshotBanner.style.display = "none"; return;
  }
  state.inventario = snap.items;
  if (showBanner) {
    snapshotBanner.textContent = `📦 Modo offline · datos del ${new Date(snap.ts).toLocaleString()}`;
    snapshotBanner.style.display = "";
  } else { snapshotBanner.style.display = "none"; }
  renderList();
}

function renderList() {
  const items = state.inventario.filter(it =>
    !state.filtro || (String(it.producto || "").toLowerCase().includes(state.filtro))
  );
  listMeta.textContent = `${items.length} de ${state.inventario.length}`;
  if (items.length === 0) {
    productListEl.innerHTML = '<li class="empty">Sin resultados</li>'; return;
  }
  productListEl.innerHTML = items.map(it => {
    const ec = estadoOf(it);
    const nameHtml = state.filtro ? highlight(it.producto, state.filtro) : esc(it.producto);
    if (state.modoLista === "directo") {
      return `<li class="estado-${ec}" data-codigo="${esc(it.codigo)}">
        <div class="product-info">
          <div class="product-name">${nameHtml}</div>
          <div class="product-qty">Stock: <span class="qty-num">${it.cantidad}</span> ${esc(it.unidad || "")}</div>
        </div>
        <div class="qty-actions">
          <button class="btn-minus" data-action="minus">−</button>
          <button class="btn-plus" data-action="plus">+</button>
        </div>
      </li>`;
    } else {
      return `<li class="estado-${ec}" data-codigo="${esc(it.codigo)}">
        <div class="product-info">
          <div class="product-name">${nameHtml}</div>
          <div class="product-qty">Stock: <span class="qty-num">${it.cantidad}</span> ${esc(it.unidad || "")}</div>
        </div>
        <div class="qty-actions">
          <button class="btn-add primary" data-action="add">+ Carrito</button>
        </div>
      </li>`;
    }
  }).join("");
  attachListHandlers(items);
}

function estadoOf(it) {
  if (it.cantidad <= it.critico) return "CRITICO";
  if (it.cantidad <= it.bajo) return "BAJO";
  return "NORMAL";
}

function attachListHandlers(items) {
  // Construir índice por código para emparejar DOM con item correcto
  // (evita asumir orden idéntico cuando hay re-renders concurrentes)
  const byCode = new Map();
  items.forEach(it => byCode.set(String(it.codigo || ""), it));

  // Solo li con data-codigo (NO los <li class="empty">)
  productListEl.querySelectorAll("li[data-codigo]").forEach(li => {
    const code = li.getAttribute("data-codigo");
    const item = byCode.get(code);
    if (!item) return; // defensa: no enganchar si no hay match

    if (state.modoLista === "directo") {
      const minusBtn = li.querySelector('[data-action="minus"]');
      const plusBtn  = li.querySelector('[data-action="plus"]');
      if (minusBtn) bindTapAndLongPress(minusBtn, () => directMove(item, "salida", 1),  () => openCustomQtyModal(item, "salida"));
      if (plusBtn)  bindTapAndLongPress(plusBtn,  () => directMove(item, "entrada", 1), () => openCustomQtyModal(item, "entrada"));
    } else {
      const addBtn = li.querySelector('[data-action="add"]');
      if (addBtn) addBtn.addEventListener("click", () => {
        addToCart(item, 1, "salida");
        toast(`+ ${item.producto}`, "info", 1000);
      });
    }
  });
}

function bindTapAndLongPress(el, onTap, onLong) {
  let timer = null, triggered = false;
  el.addEventListener("pointerdown", () => {
    triggered = false;
    timer = setTimeout(() => { triggered = true; if (navigator.vibrate) navigator.vibrate(40); onLong(); }, LONG_PRESS_MS);
  });
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener("pointerup", () => { cancel(); if (!triggered) onTap(); });
  el.addEventListener("pointerleave", cancel);
  el.addEventListener("pointercancel", cancel);
}

async function directMove(item, tipo, cantidad) {
  if (!item.codigo) {
    toast("Producto sin código. Agrégale uno en el Sheet.", "error", 2500);
    return;
  }
  const r = await tryMove(item.codigo, tipo, cantidad, item);
  // Truncar nombre largo para que el toast no se desborde
  const nombre = item.producto.length > 20 ? item.producto.slice(0, 18) + "…" : item.producto;
  if (r.success) {
    if (r.queued) toast(`📥 ${nombre} en cola · Stock: ${r.stockEstimado}`, "warn", 1500);
    else toast(`✓ ${nombre} ${tipo === "entrada" ? "+" : "−"}${cantidad} · Stock: ${r.stockNuevo}`, "success", 1500);
    if (navigator.vibrate) navigator.vibrate(40);
    renderList();
  } else { toast(`${nombre}: ${r.error}`, "error", 2500); }
}

function openCustomQtyModal(item, tipoDefault) {
  if (!item.codigo) { toast("Producto sin código", "error"); return; }
  openMovementModal(item, item.codigo);
  setTimeout(() => {
    document.querySelectorAll("#typeToggle button").forEach(b => {
      b.classList.toggle("active", b.dataset.tipo === tipoDefault);
    });
  }, 10);
}

/* ============ CARRITO ============ */
function addToCart(item, cantidad = 1, tipo = "salida") {
  if (!item.codigo) { toast("Sin código no se puede agregar", "error"); return; }
  const ex = state.carrito.find(x => x.codigo === item.codigo && x.tipo === tipo);
  if (ex) ex.cantidad += cantidad;
  else state.carrito.push({ codigo: item.codigo, producto: item.producto, cantidad, tipo });
  saveCart(); updateCartFab();
}
function updateCartFab() {
  const fab = document.getElementById("cartFab");
  const isList = document.getElementById("panelList").classList.contains("active");
  const show = isList && state.modoLista === "carrito" && state.carrito.length > 0;
  fab.style.display = show ? "flex" : "none";
  document.getElementById("cartCount").textContent = state.carrito.length;
}
document.getElementById("cartFab").addEventListener("click", openCartModal);

function openCartModal() {
  const tpl = `
    <div class="modal-header">
      <h2>Carrito (${state.carrito.length})</h2>
      <div class="sub">Edita cantidad o tipo antes de confirmar</div>
    </div>
    <div class="modal-body" id="cartBody"></div>
    <div class="modal-footer">
      <button class="ghost" id="btnClearCart">Vaciar</button>
      <button class="primary" id="btnConfirmCart">Confirmar todo</button>
    </div>`;
  const modal = openModal(tpl);
  renderCartBody(modal);
  modal.querySelector("#btnClearCart").addEventListener("click", () => {
    if (confirm("¿Vaciar el carrito?")) { state.carrito = []; saveCart(); updateCartFab(); closeModal(); }
  });
  modal.querySelector("#btnConfirmCart").addEventListener("click", () => commitCart(modal));
}
function renderCartBody(modal) {
  const body = modal.querySelector("#cartBody");
  if (state.carrito.length === 0) { body.innerHTML = '<div class="empty">Carrito vacío</div>'; return; }
  body.innerHTML = state.carrito.map((it, idx) => `
    <div class="cart-item" data-idx="${idx}">
      <div class="info">
        <div class="name">${esc(it.producto)}</div>
        <div class="small mono">${esc(it.codigo)}</div>
      </div>
      <button class="type-pill ${it.tipo}" data-toggle-type>${it.tipo === "salida" ? "↓ SAL" : "↑ ENT"}</button>
      <input class="qty-input" type="number" min="1" value="${it.cantidad}" data-qty>
      <button class="delete" data-delete>✕</button>
    </div>`).join("");
  body.querySelectorAll(".cart-item").forEach(row => {
    const idx = Number(row.dataset.idx);
    row.querySelector("[data-toggle-type]").addEventListener("click", () => {
      state.carrito[idx].tipo = state.carrito[idx].tipo === "salida" ? "entrada" : "salida";
      saveCart(); renderCartBody(modal);
    });
    row.querySelector("[data-qty]").addEventListener("change", e => {
      const v = Math.max(1, Number(e.target.value) || 1);
      state.carrito[idx].cantidad = v; e.target.value = v; saveCart();
    });
    row.querySelector("[data-delete]").addEventListener("click", () => {
      state.carrito.splice(idx, 1); saveCart(); updateCartFab(); renderCartBody(modal);
      if (state.carrito.length === 0) closeModal();
    });
  });
}

async function commitCart(modal) {
  const btn = modal.querySelector("#btnConfirmCart");
  btn.disabled = true;
  let exitos = 0, encolados = 0;
  for (let i = 0; i < state.carrito.length; ) {
    const it = state.carrito[i];
    btn.innerHTML = `<span class="spinner"></span> ${i+1}/${state.carrito.length}`;
    if (!navigator.onLine) {
      enqueue("move", { codigo: it.codigo, tipo: it.tipo, cantidad: it.cantidad });
      const itemRef = state.inventario.find(x => x.codigo === it.codigo);
      if (itemRef) itemRef.cantidad += (it.tipo === "entrada" ? it.cantidad : -it.cantidad);
      state.carrito.splice(i, 1); saveCart(); encolados++; continue;
    }
    try {
      const r = await api("move", { codigo: it.codigo, tipo: it.tipo, cantidad: it.cantidad });
      if (r.ok) {
        const itemRef = state.inventario.find(x => x.codigo === it.codigo);
        if (itemRef) itemRef.cantidad = r.stockNuevo;
        state.carrito.splice(i, 1); saveCart(); exitos++;
      } else {
        const decision = await askFailureDecision(it, r);
        if (decision === "skip") i++;
        else if (decision === "abort") break;
      }
    } catch {
      enqueue("move", { codigo: it.codigo, tipo: it.tipo, cantidad: it.cantidad });
      const itemRef = state.inventario.find(x => x.codigo === it.codigo);
      if (itemRef) itemRef.cantidad += (it.tipo === "entrada" ? it.cantidad : -it.cantidad);
      state.carrito.splice(i, 1); saveCart(); encolados++; setOnline(false);
    }
  }
  saveSnapshot(); closeModal(); updateCartFab(); renderList();
  let msg = `✓ ${exitos} aplicados`;
  if (encolados) msg += ` · 📥 ${encolados} en cola`;
  if (state.carrito.length) msg += ` · ${state.carrito.length} pendientes`;
  toast(msg, encolados > 0 ? "warn" : "success", 3500);
}

function askFailureDecision(item, errResp) {
  return new Promise(resolve => {
    const motivo = errResp.stockInsuficiente
      ? `Stock insuficiente (disponible: ${errResp.stockAnterior})`
      : (errResp.notFound ? "Código no encontrado" : (errResp.error || "Error"));
    const tpl = `
      <div class="modal-header">
        <h2>Falla en un item</h2>
        <div class="sub">${esc(item.producto)} · ${item.tipo} ${item.cantidad}</div>
      </div>
      <div class="modal-body">
        <div class="info-block" style="background:var(--red-bg);border-color:#f5b5b5;">${esc(motivo)}</div>
        <p style="font-size:14px;color:var(--text-muted);">¿Qué hacer con este item?</p>
      </div>
      <div class="modal-footer" style="flex-direction:column;gap:8px;">
        <button class="primary" data-decision="retry">Reintentar</button>
        <button data-decision="skip">Saltar este (continuar)</button>
        <button class="danger" data-decision="abort">Cancelar resto</button>
      </div>`;
    const m = openModal(tpl, { dismissable: false });
    m.querySelectorAll("[data-decision]").forEach(b => {
      b.addEventListener("click", () => { closeModalSpecific(m); resolve(b.dataset.decision); });
    });
  });
}

/* ============ MODAL HELPERS ============ */
const _modalStack = [];
function openModal(html, opts = {}) {
  const root = document.getElementById("modalRoot");
  const bd = document.createElement("div"); bd.className = "modal-backdrop";
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = html;
  bd.appendChild(m); root.appendChild(bd); _modalStack.push(bd);
  const close = () => closeModalSpecific(m);
  m.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", close));
  if (opts.dismissable !== false) bd.addEventListener("click", e => { if (e.target === bd) close(); });
  return m;
}
function closeModal() {
  const top = _modalStack.pop();
  if (top) top.remove();
  // Si ya no quedan modales abiertos y el escáner está activo, reanudar
  if (_modalStack.length === 0) resumeScanner();
}
function closeModalSpecific(m) {
  const bd = m.parentElement;
  const idx = _modalStack.indexOf(bd);
  if (idx >= 0) _modalStack.splice(idx, 1);
  if (bd) bd.remove();
  if (_modalStack.length === 0) resumeScanner();
}

/* ============ UTIL ============ */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ============ INIT ============ */
loadSnapshot();
updateConnBadge();
if (navigator.onLine && state.queue.length > 0) setTimeout(autoSync, 800);
</script>
